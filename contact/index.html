<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CONTACT</title>
    <link rel="icon" type="image/png" href="../images/icons/favicon.png">

<style>
    html,
    body {
        margin: 0;
        padding: 0;
    }

    .site-header {
        position: fixed;
        top: 14px;
        left: 0;
        width: 100%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 16px 24px;
        box-sizing: border-box;

        z-index: 10;
    }

    .site-navigation {
        display: flex;
        gap: 16px;
    }

    .site-header a {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        text-decoration: none;
    }

    .site-logo {
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }

    .site-logo img {
        width: 13px;
        height: 13px;
        display: block;
    }
    .contact-main {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 100px 24px 50px;
    box-sizing: border-box;
}

.contact-layout {
    width: min(86vw, 1000px);

    display: grid;
    grid-template-columns: minmax(260px, 430px) minmax(260px, 400px);

    align-items: center;
    justify-content: center;

    gap: 70px;

    transform: translateY(-40px);
}

.contact-content {
    max-width: 400px;
    text-align: left;
}

.contact-content h1 {
    margin-bottom: 24px;

    color: #13265C;

    font-size: 18px;
    font-weight: 600;

    text-transform: lowercase;
}

.contact-introduction {
    margin-bottom: 30px;

    color: #222222;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.7;
}

.contact-links {
    display: flex;
    flex-direction: column;
    align-items: flex-start;

    gap: 12px;
}

.contact-links a {
    color: #222222;

    font-size: 15px;
    font-weight: 500;

    text-decoration: none;
}
</style>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="contact-page">

    <header class="site-header">

        <a class="site-logo" href="../">
    <img src="../images/icons/logo.png" alt="">
    <span>Tobias</span>
</a>

<nav class="site-navigation" aria-label="Main navigation">
    <a href="../">home</a>
    <a href="../gallery/">gallery</a>
    <a href="../about/">about me</a>
    <a href="../contact/">contact</a>
</nav>

    </header>

    <main class="contact-main">

        <main class="contact-main">

    <section class="contact-layout">

        <div class="contact-image-container">
            <img
                class="contact-image"
                src="../images/contact/self-portrait.jpg"
                alt="Self-portrait of Tobias"
            >
        </div>

        <div class="contact-content">

            <h1>contact</h1>

            <p class="contact-introduction">
                Based in Zeeland, the Netherlands. I’m open to photography assignments 
                and collaborations. Get in touch to discuss a project or
                request a high-resolution image for a print or other use cases.

            </p>

            <div class="contact-links">

                <a href="mailto:tmolphotography@gmail.com">
                    tmolphotography@gmail.com
                </a>

                <a
                    href="https://www.instagram.com/mol_tobias/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Instagram
                </a>

            </div>

        </div>

    </section>

    </main>

    <script src="../js/nav.js"></script>

</body>

</html>
