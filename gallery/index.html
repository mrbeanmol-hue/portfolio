    <title>GALLERY</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
    }

    .site-header {
        position: fixed;
        top: 14px;
        left: 0;
        width: 100%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 16px 24px;
        box-sizing: border-box;

        z-index: 10;
    }

    .site-navigation {
        display: flex;
        gap: 16px;
    }

    .site-header a {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        text-decoration: none;
    }

    .site-logo {
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }

    .site-logo img {
        width: 13px;
        height: 13px;
        display: block;
    }

.gallery-main {
    padding: 100px 24px 50px;
}

.gallery-layout {
    width: min(94vw, 1500px);
    margin: 0 auto;

    display: grid;
    grid-template-columns: 120px minmax(0, 1fr);
    gap: 28px;

    align-items: start;
}

.gallery-filters {
    position: sticky;
    top: 100px;

    display: flex;
    flex-direction: column;
    align-items: flex-start;

    gap: 10px;
}

.gallery-filter {
    padding: 0;
    border: none;
    background: none;

    color: #222222;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    font-weight: 500;
}
.visually-hidden {
    position: absolute;

    width: 1px;
    height: 1px;

    padding: 0;
    margin: -1px;

    overflow: hidden;
    clip: rect(0, 0, 0, 0);

    white-space: nowrap;
    border: 0;
}

</style>

<link rel="stylesheet" href="../css/style.css">

</head>
